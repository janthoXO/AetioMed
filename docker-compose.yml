services:
  server:
    build: .
    ports:
      - "${PORT:-3030}:${PORT:-3030}"
    volumes:
      - ./data:/app/data
    environment:
      - FEATURES=${FEATURES:-DEBUG,NATS,REST}
      - PORT=${PORT:-3030}

      # ─── LLM ──────────────────────────────────────────────────────────
      - LLM_API_KEY
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.1}
      - LLM_URL=${LLM_URL:-http://ollama:11434}

      # Optional per-role overrides — no default, omitted from the
      # container's environment entirely when unset.
      - LLM_GENERATOR_PROVIDER
      - LLM_GENERATOR_MODEL
      - LLM_GENERATOR_API_KEY
      - LLM_GENERATOR_URL
      - LLM_JUDGE_PROVIDER
      - LLM_JUDGE_MODEL
      - LLM_JUDGE_API_KEY
      - LLM_JUDGE_URL
      - LLM_TRANSLATOR_PROVIDER
      - LLM_TRANSLATOR_MODEL
      - LLM_TRANSLATOR_API_KEY
      - LLM_TRANSLATOR_URL

      # Per-request LLM selection (requires ALLOW_LLMS in FEATURES)
      - ALLOWED_LLMS

      # ─── Graph topology ──────────────────────────────────────────────
      - TRANSLATION_SANDWICH=${TRANSLATION_SANDWICH:-true}

      # ─── Language ────────────────────────────────────────────────────
      - LANGUAGES=${LANGUAGES:-en,de}

      # ─── Data ────────────────────────────────────────────────────────
      - CATALOG_DIR=${CATALOG_DIR:-data}
      - CACHE_DIR=${CACHE_DIR:-data/cache}
      - SYMPTOM_CACHE_TTL_DAYS=${SYMPTOM_CACHE_TTL_DAYS:-30}
      - MAX_CONTENT_PART_BYTES=${MAX_CONTENT_PART_BYTES:-5000000}

      # ─── Referral letters (e.g. aetioreferral:50051 with --profile REFERRAL) ─
      - MODALITY_PROVIDERS # e.g. CHIEF_COMPLAINT_REFERRAL_LETTER; REFERRAL_GRPC_ADDRESS is read only when enabled
      - REFERRAL_GRPC_ADDRESS

      # ─── ECG (e.g. aetioecg:50051 with --profile ECG; token PROCEDURE_RESULT_ECG) ─
      - ECG_GRPC_ADDRESS

      # ─── NATS (only read when NATS is in FEATURES) ──────────────────
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_USER=${NATS_USER:-nats}
      - NATS_PASSWORD=${NATS_PASSWORD:-nats}

      # ─── ICD (on when ICD_API_URL is set) ───
      - ICD_API_URL
      - ICD_RELEASE=${ICD_RELEASE:-2026-01}

      # ─── Concurrency ─────────────────────────────────────────────────
      - MAX_CONCURRENT_GENERATIONS=${MAX_CONCURRENT_GENERATIONS:-4}

      # ─── OpenTelemetry ───────────────────────────────────────────────
      - OTEL_SDK_DISABLED
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
      - OTEL_SERVICE_NAME
      - OTEL_RESOURCE_ATTRIBUTES

    depends_on:
      ollama:
        condition: service_started
      icd:
        condition: service_healthy
        required: false
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.21.2
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - MODEL_NAME=${LLM_MODEL:-llama3.1}
    entrypoint: >
      sh -c "ollama serve & sleep 5 && ollama pull $$MODEL_NAME && wait"

  icd:
    profiles: [ICD]
    image: whoicd/icd-api:2.6.0
    ports:
      - "${ICD_PORT:-3001}:80" # iluvi-api's own container already takes 3000
    environment:
      - acceptLicense=true
      - saveAnalytics=false
      - include=${ICD_RELEASE:-2026-01}_de-en # release_languages; must cover LANGUAGES
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header 'API-Version: v2' --header 'Accept: application/json' --header 'Accept-Language: en' http://127.0.0.1/icd/release/11/${ICD_RELEASE:-2026-01}/mms || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  nats:
    profiles: [NATS]
    image: nats:2.12.1
    ports:
      - "4222:4222" # client connections
      - "8222:8222" # monitoring http (server stats)
    # Enable JetStream and persist its store to a Docker volume. Credentials are optional.
    command: >
      --js --store_dir /data
      --user ${NATS_USER:-nats} --pass ${NATS_PASSWORD:-nats}
      --http_port 8222
    volumes:
      - nats_data:/data
    restart: unless-stopped

  # PDF referral letters for the chief complaint (MODALITY_PROVIDERS=CHIEF_COMPLAINT_REFERRAL_LETTER, REFERRAL_GRPC_ADDRESS=aetioreferral:50051)
  # Needs AetioReferral >= 0.0.2, the first release with the gRPC server.
  aetioreferral:
    profiles: [REFERRAL]
    image: ghcr.io/janthoxo/aetioreferral/server:0.0.2
    command: ["grpc", "--host", "0.0.0.0", "--port", "50051"]
    ports:
      - "50052:50051" # host 50052: aetioecg has 50051
    restart: unless-stopped

  # Real 12-lead ECG SVGs for procedure results (MODALITY_PROVIDERS=PROCEDURE_RESULT_ECG, ECG_GRPC_ADDRESS=aetioecg:50051)
  # Needs AetioECG >= 0.0.2, the first release with the gRPC server.
  aetioecg:
    profiles: [ECG]
    image: ghcr.io/janthoxo/aetioecg/server:0.0.2
    command: ["grpc", "--host", "0.0.0.0", "--port", "50051"]
    environment:
      - PTBXL_SOURCE
    ports:
      - "50051:50051"
    restart: unless-stopped

  # to debug nats
  nats-box:
    profiles: [NATS]
    image: natsio/nats-box
    # Tell nats-box to sleep so the container stays alive in the background
    command: sleep infinity
    environment:
      - NATS_URL=nats://${NATS_USER:-nats}:${NATS_PASSWORD:-nats}@nats:4222
    depends_on:
      - nats

volumes:
  ollama_data:
  nats_data:
