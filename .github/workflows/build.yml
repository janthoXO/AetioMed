name: Build Generator

on:
  pull_request:
    paths:
      - "src/**"
      - "contracts/**"
      - "scripts/exportContracts.ts"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check API contracts
        run: |
          pnpm contracts:export
          if [ -n "$(git status --porcelain contracts/)" ]; then
            git diff contracts/
            echo "::error::contracts/ out of date with src/api/ Zod schemas. Run pnpm contracts:export and commit."
            exit 1
          fi

      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js --user nats --pass nats
          for i in $(seq 1 20); do nc -z localhost 4222 && break; sleep 1; done

      - name: Test
        run: pnpm test
        env:
          NATS_TEST_URL: nats://localhost:4222

      - name: Build
        run: pnpm run build
